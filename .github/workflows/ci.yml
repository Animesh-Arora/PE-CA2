
name: Penguins ML API - CI Pipeline - CSE

# Define when GitHub should run this workflow
on:
  # Run CI whenever code is pushed to main
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Restrict permissions to reading repository content
permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository content
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Install Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Step 3: Install dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Execute automated tests
      - name: Run automated tests
        run: python -m pytest -v

      # Step 5: Build Docker image
      - name: Build Docker Image
        run: docker build -t penguins-ml-api:${{ github.sha }} .
